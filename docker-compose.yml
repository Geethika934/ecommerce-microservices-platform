version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: orderflow
      PGTZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - orderflow-network

  mongodb:
    image: mongo:7
    container_name: orderflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - orderflow-network

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"
    networks:
      - orderflow-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: orderflow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - orderflow-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: orderflow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - orderflow-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: orderflow-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - orderflow-network

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: orderflow-auth-service
    depends_on:
      - postgres
      - redis
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow
      SPRING_DATA_REDIS_HOST: redis
    networks:
      - orderflow-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: orderflow-order-service
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orderflow
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: orderflow-product-service
    depends_on:
      - mongodb
      - kafka
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/orderflow_products
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: orderflow-notification-service
    depends_on:
      - kafka
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - orderflow-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: orderflow-api-gateway
    depends_on:
      - auth-service
      - order-service
      - product-service
      - notification-service
    ports:
      - "8080:8080"
    networks:
      - orderflow-network

volumes:
  postgres-data:
  mongo-data:

networks:
  orderflow-network:
    driver: bridge