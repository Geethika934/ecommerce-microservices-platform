spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:5432/orderflow
    username: postgres
    password: <your-db-password>
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: <your-256-bit-base64-secret>
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

server:
  port: 8081